name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Actions
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/${{ github.repository }}/ci-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout fonts
        uses: actions/checkout@v4
        with:
          repository: harryzorus/fonts
          token: ${{ secrets.FONTS_TOKEN }}
          path: fonts

      - name: Compile resume
        run: latexmk -xelatex -interaction=nonstopmode -g resume.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: resume.pdf
